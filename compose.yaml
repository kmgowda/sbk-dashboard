name: sbk-dashboard

services:
  sbk-dashboard:
    image: ${SBK_DASHBOARD_IMAGE:-kmgowda/sbk-dashboard:1.26.8.2}
    pull_policy: missing
    ports:
      # Authentication is disabled. Set SBK_DASHBOARD_PUBLISH_HOST=0.0.0.0 only on a protected network.
      - "${SBK_DASHBOARD_PUBLISH_HOST:-127.0.0.1}:9721:9721"
      - "${SBK_DASHBOARD_PUBLISH_HOST:-127.0.0.1}:3000:3000"
    volumes:
      - sbk-dashboard-data:/var/lib/sbk-dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  sbk-dashboard-data:

networks:
  default:
    enable_ipv6: true
