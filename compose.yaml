name: sbk-dashboard

services:
  sbk-dashboard:
    image: ${SBK_DASHBOARD_IMAGE:-ghcr.io/kmgowda/sbk-dashboard:1.26.8.1}
    pull_policy: missing
    ports:
      - "9721:9721"
      - "3000:3000"
    volumes:
      - sbk-dashboard-data:/var/lib/sbk-dashboard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sbk-dashboard-data:

networks:
  default:
    enable_ipv6: true
