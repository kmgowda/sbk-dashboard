[metadata]
name = sbk-dashboard
version = 1.0.0
description = SBK/SBM Grafana dashboard control server
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    psutil>=5.9,<8
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
sbk_dashboard =
    resources/monitoring-download.properties
    resources/grafana/dashboards/sbk-dashboard.json
    resources/web/*.html
    resources/web/*.css
    resources/web/*.js

[options.entry_points]
console_scripts =
    sbk-dashboard = sbk_dashboard.main:main
