name: Container

on:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "pyproject.toml"
      - "src/**"
      - "tests/container_smoke.py"
      - "tests/test_container.py"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build runnable AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: sbk-dashboard:ci
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=sbk-dashboard-amd64
          cache-to: type=gha,mode=max,scope=sbk-dashboard-amd64
      - name: Validate runtime, ports, dashboards, persistence, and shutdown
        run: python tests/container_smoke.py --image sbk-dashboard:ci
      - name: Build ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=sbk-dashboard-arm64
          cache-to: type=gha,mode=max,scope=sbk-dashboard-arm64

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from sbk_dashboard.version import VERSION

          release = os.environ["RELEASE_TAG"].removeprefix("v")
          if release != VERSION:
              raise SystemExit(f"release tag {release!r} does not match package version {VERSION!r}")
          PY
      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: |
            type=gha,scope=sbk-dashboard-amd64
            type=gha,scope=sbk-dashboard-arm64
          provenance: mode=max
          sbom: true
