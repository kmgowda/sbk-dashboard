name: Container

on:
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "compose.yaml"
      - "compose.dev.yaml"
      - "compose.resources.yaml"
      - ".trivyignore.yaml"
      - "pyproject.toml"
      - "grafana-plugin/**"
      - "requirements/container-build.txt"
      - "requirements/container-os.txt"
      - "requirements/container-runtime.txt"
      - "scripts/docker_safe_extract.py"
      - "src/**"
      - "tests/test_docker_safe_extract.py"
      - "tests/container_smoke.py"
      - "tests/compose_contract.py"
      - "tests/test_container.py"
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Resolve application version
        id: version
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from sbk_dashboard.version import VERSION

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"value={VERSION}\n")
              output.write(
                  "build_date="
                  + subprocess.check_output(
                      ["git", "show", "-s", "--format=%cI", "HEAD"], text=True
                  ).strip()
                  + "\n"
              )
          PY
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Validate production and development Compose definitions
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.resources.yaml config --quiet
          python3 tests/compose_contract.py
      - name: Build runnable AMD64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: sbk-dashboard:ci
          build-args: |
            APPLICATION_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha,scope=sbk-dashboard-amd64
          cache-to: type=gha,mode=max,scope=sbk-dashboard-amd64,ignore-error=true
      - name: Enforce container vulnerability policy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sbk-dashboard:ci
          version: v0.74.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Validate runtime, ports, dashboards, persistence, and shutdown
        run: python3 tests/container_smoke.py --image sbk-dashboard:ci
  arm64-validate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Resolve application version
        id: version
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from sbk_dashboard.version import VERSION

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"value={VERSION}\n")
              output.write(
                  "build_date="
                  + subprocess.check_output(
                      ["git", "show", "-s", "--format=%cI", "HEAD"], text=True
                  ).strip()
                  + "\n"
              )
          PY
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build runnable ARM64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: sbk-dashboard:ci-arm64
          build-args: |
            APPLICATION_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: type=gha,scope=sbk-dashboard-arm64
          cache-to: type=gha,mode=max,scope=sbk-dashboard-arm64,ignore-error=true
      - name: Validate ARM64 runtime, persistence, restore, and shutdown
        run: python3 tests/container_smoke.py --image sbk-dashboard:ci-arm64

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, arm64-validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify release tag matches the package version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import os
          import subprocess
          from sbk_dashboard.version import VERSION

          release = os.environ["RELEASE_TAG"].removeprefix("v")
          if release != VERSION:
              raise SystemExit(f"release tag {release!r} does not match package version {VERSION!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"value={VERSION}\n")
              output.write(
                  "build_date="
                  + subprocess.check_output(
                      ["git", "show", "-s", "--format=%cI", "HEAD"], text=True
                  ).strip()
                  + "\n"
              )
          PY
      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            kmgowda/sbk-dashboard
            ghcr.io/kmgowda/sbk-dashboard
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.created=${{ steps.version.outputs.build_date }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multi-architecture image
        id: publish-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            APPLICATION_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
          cache-from: |
            type=gha,scope=sbk-dashboard-amd64
            type=gha,scope=sbk-dashboard-arm64
          provenance: mode=max
          sbom: true
      - name: Verify version and latest tags in both registries
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          for image in kmgowda/sbk-dashboard ghcr.io/kmgowda/sbk-dashboard; do
            version_digest="$(
              docker buildx imagetools inspect --raw "${image}:${RELEASE_VERSION}" |
                sha256sum | cut -d ' ' -f 1
            )"
            latest_digest="$(
              docker buildx imagetools inspect --raw "${image}:latest" |
                sha256sum | cut -d ' ' -f 1
            )"
            if [ "${version_digest}" != "${latest_digest}" ]; then
              echo "${image} version/latest digests differ" >&2
              exit 1
            fi
            docker buildx imagetools inspect "${image}:${RELEASE_VERSION}"
          done
      - name: Sign published image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.publish-image.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images="${images}${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
