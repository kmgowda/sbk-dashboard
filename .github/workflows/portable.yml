##

name: Portable releases

on:
  pull_request:
    paths:
      - ".github/workflows/portable.yml"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "scripts/build_portable.py"
      - "scripts/build_release_manifest.py"
      - "scripts/release_contract.py"
      - "scripts/select_release_assets.py"
      - "scripts/sbk_dashboard_portable_entry.py"
      - "src/**"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . "pyinstaller==6.22.0" "pyinstaller-hooks-contrib==2026.6"
      - run: python scripts/build_portable.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/portable/*
          if-no-files-found: error

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "build==1.3.0"
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish-assets:
    if: github.event_name == 'release'
    needs: [build, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: portable-*
          path: dist/release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-packages
          path: dist/release
      - name: Build checksums and release manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python scripts/build_release_manifest.py --directory dist/release
          --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Attach complete artifact set to the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          missing_output=$(python scripts/select_release_assets.py \
            --directory dist/release \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY")
          if [[ -n "$missing_output" ]]; then
            mapfile -t missing_assets <<< "$missing_output"
            gh release upload --repo "$GITHUB_REPOSITORY" "$RELEASE_TAG" "${missing_assets[@]}"
          else
            echo "All contracted release assets already exist with identical digests."
          fi
