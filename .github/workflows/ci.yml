##

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: grafana-plugin/package-lock.json
      - run: npm ci --prefix grafana-plugin
      - run: npm run typecheck --prefix grafana-plugin
      - run: npm test --prefix grafana-plugin
      - run: npm run build --prefix grafana-plugin
      - name: Verify committed Grafana plugin bundle
        run: git diff --exit-code -- src/sbk_dashboard/resources/grafana/plugins
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy
      - run: python scripts/sync_release_metadata.py
      - run: python -W error::ResourceWarning -m unittest discover -s tests -q
      - run: coverage erase
      - run: coverage run -m pytest -q
        env:
          COVERAGE_PROCESS_START: pyproject.toml
      - run: coverage combine
      - run: coverage report
      - run: python -m build --no-isolation
      - run: git diff --check

  cross-platform-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: python -c "import platform; machine = platform.machine().lower(); assert machine == 'arm64', machine"
      - name: Verify CLI
        run: python -m sbk_dashboard -v
      - run: python -W error::ResourceWarning -m unittest discover -s tests -q
