[build-system]
requires = ["setuptools>=59.6"]
build-backend = "setuptools.build_meta"

[project]
name = "sbk-dashboard"
version = "1.0.0"
description = "SBK/SBM Grafana dashboard control server"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "KMG"}]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
sbk-dashboard = "sbk_dashboard.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sbk_dashboard = [
  "resources/monitoring-download.properties",
  "resources/grafana/dashboards/sbk-dashboard.json",
  "resources/web/*.html",
  "resources/web/*.css",
  "resources/web/*.js",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sbk_dashboard"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
